name: Publish Study Tape

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check timer calculations
        run: node --test test/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
          for (let attempt = 0; attempt < 30; attempt++) {
            const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'User-Agent': 'StudyTape' } });
            if (!response.ok) throw new Error(`Artifact lookup failed: ${response.status}`);
            const data = await response.json();
            if (data.artifacts.some(a => a.name === process.env.ARTIFACT_NAME && !a.expired)) process.exit(0);
            console.log('Waiting for uploaded artifact to become available...');
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Uploaded artifact metadata was not available after five minutes');
          NODE
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
